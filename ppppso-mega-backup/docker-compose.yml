version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ppppso-mega-backup_server_1
      APP_PORT: 8080

  server:
    image: ghcr.io/ppppso/mega-backup:1.1.0@sha256:f061ce4f800f694f608db9571028027510374d4b5a9c5ae854f81fb8a4055d6e
    # The entrypoint starts as root only to fix folder ownership, then runs everything
    # as PUID:PGID.
    init: true
    restart: on-failure
    # Give MEGAcmd time to save its state on shutdown.
    stop_grace_period: 1m
    environment:
      PUID: "1000"
      PGID: "1000"
      # The app's own login (shown on the app's page in Umbrel).
      APP_PASSWORD: ${APP_PASSWORD}
      # Time zone for the nightly backup time; changeable in the app's settings.
      TZ: Etc/UTC
    volumes:
      # MEGA session, restic password, settings, logs.
      - ${APP_DATA_DIR}/data/config:/config
      # The three folders default to sub-folders of Downloads, so the install dialog
      # asks for each one; users can change them in the app's settings (folderAccess).
      # MEGA folder: the synced MEGA files.
      - ${UMBREL_ROOT}/data/storage/downloads/MEGA:/data/current
      # Backup folder: the restic repository (snapshots).
      - ${UMBREL_ROOT}/data/storage/downloads/mega-backup:/data/repo
      # Restore folder: where restored files go.
      - ${UMBREL_ROOT}/data/storage/downloads/mega-restores:/data/restore
